<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동네인증 - 당근</title>
</head>

<body>

    <!-- 메인 -->
    <main class="verification-page">

        <section class="verification-container">

            <!-- 주소 검색 -->
            <section class="address-section">

                <h1>어디에 살고 계신가요?</h1>

                <form id="addressForm" class="address-form">

                    <label for="addressInput">
                        주소 검색
                    </label>

                    <input
                        type="text"
                        id="addressInput"
                        name="address"
                        placeholder="예) 서울 강서구 화곡동"
                    >

                    <button type="submit" id="addressSearchButton">
                        내 동네 설정
                    </button>

                </form>

            </section>


            <!-- 지도 -->
            <section class="map-section">

                <h2>현재 위치로 동네 인증하기</h2>

                <!--
                    나중에 Leaflet / OSM 등의 지도를 넣을 영역
                    JS에서 이 요소를 이용해 지도를 생성
                -->
                <div
                    id="map"
                    class="map"
                    aria-label="동네 인증 지도"
                ></div>

            </section>


            <!-- 위치 인증 상태 -->
            <section class="location-status">

                <p id="locationMessage">
                    현재 위치는 서울 강서구 화곡동입니다.
                </p>

            </section>


            <!-- 인증 -->
            <section class="verification-action">

                <button
                    type="button"
                    id="verificationButton"
                    disabled
                >
                    동네인증 완료하기
                </button>

            </section>

        </section>

    </main>

</body>
</html>
