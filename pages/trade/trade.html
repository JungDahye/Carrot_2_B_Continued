<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="이스트소프트 오르미 프론트엔드 15기 2 B Continued 2차 프로젝트 당근마켓 클론 코딩입니다." />
    <meta name="author" content="정다혜, 김현호, 황길용" />
    <meta name="keywords" content="당근마켓 클론, HTML, CSS, Video, 오르미, 이스트소프트" />
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/trade.css">
    <link rel="stylesheet" href="../../css/header.css" />
    <title>당근 마켓 클론 코딩</title>
</head>
<body>
    <!-- 공용 헤더 -->
    <header data-login="false">
      <div class="header-area">
        <div class="logo">
          <a href="../home/"><img src="../../images/main/logo.png" alt="당근 로고" /></a>
        </div>
        <nav>
          <button class="menu-close-btn"><span class="material-symbols-outlined"> close </span></button>
          <ul>
            <li>
              <a href="../trade/trade.html"><span>중고거래</span></a>
            </li>
            <!-- 로그인 할 때만 표기 -->
            <li>
              <a href="../location/location.html" class="login-menu"><span>동네인증</span></a>
            </li>
          </ul>
        </nav>
        <div class="header-right">
          <div class="search-bx">
            <label for="search">검색창</label>
            <input type="text" id="search" placeholder="물품이나 동네를 검색해보세요" />
          </div>
          <div class="header-btn">
            <!-- 로그인 할 때만 표기 -->
            <a href="../chat/chat.html" class="btn-chat">채팅하기</a>
            <!-- 로그인 할 때만 표기 -->
            <button id="logoutBtn" class="btn-logout">로그아웃</button>
            <a href="../auth/login.html" class="btn-login">로그인</a>
          </div>
          <!-- 모바일일 때, 검색 / 메뉴 버튼 -->
          <button class="search-btn"><span class="material-symbols-outlined"> search </span></button>
          <button class="mobile-menu-btn"><span class="material-symbols-outlined"> menu </span></button>
        </div>
      </div>
    </header>
    <!-- 공용 헤더 끝 -->

    <!-- 우측 호버 버튼 -->
    <div class="floating-area">
        <a href="write.html" class="write-btn" id="writeBtn">거래글쓰기</a>
    </div>
    <!-- 우측 호버 버튼 끝 -->

    <!-- 중앙 대문 프레임 -->
    <section class="hero">
        <div class="hero-inner">
            <!-- 대문 - 텍스트 묶음 -->
            <div class="hero-text">
                <h1 class="hero-title">믿을만한<br>이웃 간 중고거래</h1>
                <p class="hero-subtitle">동네 주민들과 가깝고 따뜻한 거래를<br>지금 경험해보세요.</p>
            </div>
            <!-- 대문 - 일러스트 이미지 -->
            <img src="../../images/trade/hero-trade-illust.png" alt="" class="hero-image">
        </div>
    </section>
    <!-- 중앙 대문 프레임 끝 -->

    <!-- 중앙 리스트 프레임 -->
    <main class="item-section">
        <!-- 리스트 - 섹션 타이틀 -->
        <h2 class="section-title">중고거래 인기매물</h2>

        <!-- 리스트 - 매물 그리드 (4행 7열) -->
        <ul class="item-grid" id="itemGrid"></ul>
    </main>
    <!-- 중앙 리스트 프레임 끝 -->

        <script type="module" src="../../js/trade.js"></script>
        <script src="../../js/header.js"></script>
        <script type="module" src="../../js/headerSearch.js"></script>
</body>
</html>
