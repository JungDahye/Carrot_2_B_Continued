<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <!-- favicon 이미지 적용 -->
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="이스트소프트 오르미 프론트엔드 15기 2 B Continued 2차 프로젝트 당근마켓 클론 코딩입니다.">
    <meta name="author" content="정다혜, 김현호, 황길용" />
    <meta name="keywords" content="당근마켓 클론, HTML, CSS, Video, 오르미, 이스트소프트">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <!-- Material icon -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <!-- reset css :: css 초기화 -->
    <link rel="stylesheet" href="../../css/reset.css">
    <!-- common css :: 공통 css -->
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/location.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <title>동네인증 - 당근</title>
</head>

<body>
    <!-- header -->
    <header>
      <div class="header-area">
        <div class="logo">
          <a href="#"><img src="../../images/main/logo.png" alt="당근 로고"></a>
        </div>
        <nav>
          <button class="menu-close-btn"><span class="material-symbols-outlined"> close </span></button>
          <ul>
            <li>
              <a href="#"><span>중고거래</span></a>
            </li>
            <!-- 로그인 할 때만 표기 -->
            <li>
              <a href="#"><span>동네인증</span></a>
            </li>
          </ul>
        </nav>
        <div class="header-right">
          <div class="search-bx">
            <label for="search">검색창</label>
            <input type="text" placeholder="물품이나 동네를 검색해보세요">
          </div>
          <div class="header-btn">
            <!-- 로그인 할 때만 표기 -->
            <a href="../chat/chat.html" class="btn-chat">채팅하기</a>
            <!-- 로그인 할 때만 표기 -->
            <!-- <button class="btn-logout">로그아웃</button> -->
            <a href="../auth/login.html" class="btn-login">로그인</a>
          </div>
          <!-- 모바일일 때, 검색 / 메뉴 버튼 -->
          <button class="search-btn"><span class="material-symbols-outlined"> search </span></button>
          <button class="mobile-menu-btn"><span class="material-symbols-outlined"> menu </span></button>
        </div>
      </div>
    </header>
    <!-- /header -->
    <!-- main -->
    <main class="verification-page">

        <section class="verification-container">

            <!-- 주소 검색 -->
            <section class="address-section">

                <h1>어디에 살고 계신가요?</h1>

                <form id="addressForm" class="address-form">

                    <label for="addressInput">
                    </label>

                    <input
                        type="text"
                        id="addressInput"
                        name="address"
                        placeholder="예) 서울 강서구 화곡동"
                    >

                    <button type="submit" id="addressSearchButton">
                        내 동네 설정
                    </button> 

                </form>

            </section>


            <!-- 지도 -->
            <section class="map-section">

                <h2>현재 위치로 동네 인증하기</h2>

                <!--
                    나중에 Leaflet / OSM 등의 지도를 넣을 영역
                    JS에서 이 요소를 이용해 지도를 생성
                -->
                <div
                    id="map"
                    class="map"
                    aria-label="동네 인증 지도"
                ></div>

            </section>


            <!-- 위치 인증 상태 -->
            <section class="location-status">

                <p id="locationMessage">
                    현재 위치는 서울 강서구 화곡동입니다.
                </p>

            </section>


            <!-- 인증 -->
            <section class="verification-action">

                <button
                    type="button"
                    id="verificationButton"
                    disabled
                >
                    동네인증 완료하기
                </button>

            </section>

        </section>

    </main>

    <!-- /main -->

    <!-- 동네인증 완료 모달 (평소엔 숨겨져 있음) -->
    <div id="completeModal" class="modal-overlay">
        <div class="modal-box">
            <p>동네인증이 완료되었습니다.</p>
            <button type="button" id="modalConfirmButton" class="modal-confirm-button">확인</button>
        </div>
    </div>
    <!-- 상단 header active 클래스 -->
    <script src="../../js/header.js"></script>

    <!-- Leaflet 라이브러리 본체 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- location 페이지 동네인증 js -->
    <script src="../../js/location.js"></script>
</body>
</html>
