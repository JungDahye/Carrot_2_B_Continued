<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- favicon 이미지 적용 -->
  <link rel="icon" type="image/x-icon" href="../../favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="이스트소프트 오르미 프론트엔드 15기 2 B Continued 2차 프로젝트 당근마켓 클론 코딩입니다.">
  <meta name="author" content="정다혜, 김현호, 황길용">
  <meta name="keywords" content="당근마켓 클론, HTML, CSS, Video, 오르미, 이스트소프트">
  <!-- Pretendard 웹폰트 -->
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <!-- Material icon -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <!-- reset css :: css 초기화 -->
  <link rel="stylesheet" href="../../css/reset.css">
  <!-- common css :: 공통 css -->
  <link rel="stylesheet" href="../../css/common.css">
  <!-- header css :: 헤더 css -->
  <link rel="stylesheet" href="../../css/header.css">
  <!-- location.css :: 동네인증 페이지 전용 (검색폼, 지도, 인증 버튼, 완료 모달) -->
  <link rel="stylesheet" href="../../css/location.css">
  <!-- Leaflet 지도 CSS. JS는 body 하단에서 로드 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <title>당근마켓 클론 코딩</title>
</head>
<body>
  <!-- ============================================
       상단 헤더 영역 (Header Area)
       header.js가 data-login / 메뉴 표시를 제어합니다.
  ============================================ -->
  <!-- header -->
  <header data-login="false">
    <div class="header-area">
      <div class="logo">
        <a href="../home/"><img src="../../images/main/logo.png" alt="당근 로고"></a>
      </div>
      <nav>
        <button class="menu-close-btn"><span class="material-symbols-outlined"> close </span></button>
        <ul>
          <li>
            <a href="../trade/trade.html"><span>중고거래</span></a>
          </li>
          <!-- 로그인 할 때만 표기 (.login-menu) -->
          <li>
            <a href="../location/location.html" class="login-menu"><span>동네인증</span></a>
          </li>
        </ul>
      </nav>
      <div class="header-right">
        <div class="search-bx">
          <label for="search">검색창</label>
          <input type="text" id="search" placeholder="물품이나 동네를 검색해보세요">
        </div>
        <div class="header-btn">
          <!-- 로그인 할 때만 표기 -->
          <a href="../chat/chat.html" class="btn-chat">채팅하기</a>
          <!-- 로그인 할 때만 표기 -->
          <button id="logoutBtn" class="btn-logout">로그아웃</button>
          <a href="../auth/login.html" class="btn-login">로그인</a>
        </div>
        <!-- 모바일일 때, 검색 / 메뉴 버튼 -->
        <button class="search-btn"><span class="material-symbols-outlined"> search </span></button>
        <button class="mobile-menu-btn"><span class="material-symbols-outlined"> menu </span></button>
      </div>
    </div>
  </header>
  <!-- //header -->

  <!-- ============================================
       메인: 동네인증 (location.js)
       1) 주소 검색 → Nominatim으로 좌표 변환
       2) 지도에 검색 위치·인증 반경(1.5km)·내 GPS 표시
       3) 반경 안이면 "동네인증 완료하기" 활성화
  ============================================ -->
  <main class="verification-page">
    <div class="verification-container">

      <!-- 1. 주소 검색. submit 시 location.js가 주소를 위도/경도로 바꿈 -->
      <div class="address-section">
        <h1>어디에 살고 계신가요?</h1>

        <form id="addressForm" class="address-form">
          <!-- 화면에는 숨기고 스크린 리더만 읽는 라벨 (.sr-only) -->
          <label for="addressInput" class="sr-only">동네 주소 입력</label>

          <input
            type="text"
            id="addressInput"
            name="address"
            placeholder="예) 서울 강서구 화곡동"
          >
          <button type="submit" id="addressSearchButton">
            내 동네 설정
          </button>
        </form>
      </div>

      <!-- 2. 지도. #map에 Leaflet이 OpenStreetMap 타일을 그림 -->
      <div class="map-section">
        <h2>현재 위치로 동네 인증하기</h2>
        <!-- 빈 div. 확대 버튼·출처 문구의 z-index는 location.css에서 헤더 아래로 가둠 -->
        <div
          id="map"
          class="map"
          role="region"
          aria-label="동네 인증 지도"
        ></div>
      </div>

      <!-- 3. 안내 문구. GPS/반경 결과를 location.js가 이 텍스트로 바꿈 -->
      <div class="location-status">
        <h3 id="locationMessage">
          현재 위치를 확인하는 중입니다...
        </h3>
      </div>

      <!-- 4. 인증 버튼. 기본 disabled, GPS가 반경 안에 들어오면 JS가 활성화 -->
      <div class="verification-action">
        <button
          type="button"
          id="verificationButton"
          disabled
        >
          동네인증 완료하기
        </button>
      </div>

    </div>
  </main>

  <!-- ============================================
       인증 완료 모달
       평소에는 숨김. 버튼 클릭 시 JS가 .active를 붙여 표시
  ============================================ -->
  <div id="completeModal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box">
      <p>동네인증이 완료되었습니다.</p>
      <button type="button" id="modalConfirmButton" class="modal-confirm-button">확인</button>
    </div>
  </div>

  <!-- ============================================
       스크립트
       Leaflet은 location.js보다 먼저 로드해야 L.map()을 쓸 수 있습니다.
  ============================================ -->
  <!-- 상단 header active 클래스 -->
  <script src="../../js/header.js"></script>
  <!-- Leaflet 지도 라이브러리 JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- header 검색 기능 -->
  <script type="module" src="../../js/headerSearch.js"></script>
  <!-- 동네인증 전용 JS (지오코딩, GPS, 반경 검사, 모달) -->
  <script type="module" src="../../js/location.js"></script>
</body>
</html>
